<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <style>.hide { display: none }</style>
  <rect id="visible" x="0" y="0" width="10" height="10" fill="#ff0000"/>
  <rect id="dn" display="none" x="0" y="0" width="40" height="40" fill="#999999"/>
  <rect id="dn-class" class="hide" x="0" y="0" width="40" height="40" fill="#999999"/>
  <g style="display:none"><rect id="in-hidden-group" x="0" y="0" width="40" height="40" fill="#999999"/></g>
  <rect id="vh" visibility="hidden" x="0" y="0" width="40" height="40" fill="#999999"/>
  <g visibility="hidden">
    <rect id="vis-override" visibility="visible" x="10" y="10" width="10" height="10" fill="#00ff00"/>
    <rect id="vis-inherited" x="0" y="0" width="40" height="40" fill="#999999"/>
  </g>
  <rect id="op0" opacity="0" x="0" y="0" width="40" height="40" fill="#999999"/>
  <g opacity="0"><rect id="in-op0-group" x="0" y="0" width="40" height="40" fill="#999999"/></g>
  <rect id="fo0" fill-opacity="0" x="0" y="0" width="40" height="40" fill="#999999"/>
  <rect id="fo0-stroke" x="20" y="20" width="10" height="10" fill="#0000ff" fill-opacity="0" stroke="#000000"/>
  <rect id="transparent" fill="transparent" x="0" y="0" width="40" height="40"/>
  <rect id="rgba0" fill="rgba(10, 20, 30, 0)" x="0" y="0" width="40" height="40"/>
  <rect id="half" opacity="0.5" fill="#ffff00" x="30" y="30" width="10" height="10"/>
  <rect id="nofill" fill="none" x="0" y="0" width="40" height="40"/>
  <rect id="zero" width="0" height="10" fill="#999999"/>
</svg>
