<svg xmlns="http://www.w3.org/2000/svg" width="90mm" height="30mm" viewBox="0 0 90 30">
  <!-- evenodd: both subpaths clockwise; the inner one is a hole. -->
  <path id="ring-evenodd" fill-rule="evenodd" fill="#333333" d="M5 5 H25 V25 H5 Z M10 10 H20 V20 H10 Z"/>
  <!-- nonzero: inner subpath counter-clockwise → hole (fill-rule from the style attribute). -->
  <path id="ring-nonzero" style="fill-rule:nonzero;fill:#333333" d="M35 5 H55 V25 H35 Z M40 10 V20 H50 V10 Z"/>
  <!-- nonzero, same direction: no hole, but both subpaths are kept. -->
  <path id="no-hole" fill="#333333" d="M65 5 H85 V25 H65 Z M70 10 H80 V20 H70 Z"/>
</svg>
